name: Produce reviewed narrated video
on:
  push:
    branches:
      - feat/narrated-video-demo-20261124
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/feat/narrated-video-demo-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install local synthesis tools if needed
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v espeak-ng >/dev/null || ! /usr/bin/python3 -c 'from PIL import Image'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg espeak-ng python3-pil fonts-dejavu-core
          fi
      - name: Render and verify the voiced explainer
        run: /usr/bin/python3 analysis/build_narrated_profiles.py
      - uses: actions/upload-artifact@v4
        with:
          name: narrated-datawedge-profiles
          path: classroom/media/datawedge-profiles.*
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified media to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom/media/datawedge-profiles.mp4 classroom/media/datawedge-profiles.vtt classroom/media/datawedge-profiles.json
          if ! git diff --cached --quiet; then
            git commit -m "Build reviewed DataWedge concept video with narration"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
