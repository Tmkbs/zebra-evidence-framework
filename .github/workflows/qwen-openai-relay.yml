name: Qwen + OpenAI relay (opt-in)
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: zebra-qwen-openai-relay
  cancel-in-progress: false
jobs:
  exchange:
    if: ${{ vars.ZEBRA_RELAY_ENABLED == 'true' }}
    runs-on: [self-hosted, zebra-campus]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate public task and relay unit tests
        run: |
          python3 -m unittest discover -s relay/tests -v
          python3 relay/agent_relay.py --validate-only
      - name: Recover previous public handoff from relay-only branch
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/relay-input"
          if git fetch origin agent-relay-state; then
            git show origin/agent-relay-state:handoff/state.json > "$RUNNER_TEMP/relay-input/state.json" || true
          fi
      - name: Exchange one review cycle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELAY_OPENAI_MODEL: ${{ vars.RELAY_OPENAI_MODEL }}
          RELAY_QWEN_BASE: ${{ vars.RELAY_QWEN_BASE }}
          RELAY_QWEN_MODEL: ${{ vars.RELAY_QWEN_MODEL }}
          RELAY_QWEN_KEY: ${{ secrets.RELAY_QWEN_KEY }}
        shell: bash
        run: |
          python3 relay/agent_relay.py --task relay/public_task.json \
            --state "$RUNNER_TEMP/relay-input/state.json" \
            --output "$RUNNER_TEMP/relay-input/updated.json"
      - name: Store review handoff on separate branch (never main)
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/zebra-relay-state-worktree"
          if git show-ref --verify --quiet refs/remotes/origin/agent-relay-state; then
            git worktree add -b agent-relay-state "$DEST" origin/agent-relay-state
          else
            git worktree add --detach "$DEST" HEAD
            git -C "$DEST" switch --orphan agent-relay-state
            git -C "$DEST" rm -rf .
          fi
          mkdir -p "$DEST/handoff"
          cp "$RUNNER_TEMP/relay-input/updated.json" "$DEST/handoff/state.json"
          git -C "$DEST" config user.name 'zebra-relay[bot]'
          git -C "$DEST" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$DEST" add handoff/state.json
          git -C "$DEST" commit -m 'Record public Qwen -> OpenAI relay proposal'
          git -C "$DEST" push origin HEAD:agent-relay-state
