name: Classroom end-to-end QA

on:
  push:
    branches:
      - main
      - final-delivery-review-handoff-20261120
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Single-site demo navigation (offline)
        run: node analysis/test_unified_demo.cjs

      - name: Run offline demo tests (no dependencies)
        run: npm test

      - name: Interactive vision in actual Chromium (offline)
        run: npm run test:vision:browser

      - name: Team reader visual companion (offline)
        run: node analysis/test_team_visual_browser.cjs

      - name: Encode and decode a contextual short video (offline)
        run: node analysis/test_contextual_video_browser.cjs

      - name: Retain the verified public explainer and source receipt
        uses: actions/upload-artifact@v4
        with:
          name: contextual-video-preview
          path: qa-output/contextual-video/
          retention-days: 7
          if-no-files-found: error



  narrated-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local narration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg fonts-dejavu-core python3-pil
      - name: Reproduce the offline delivery candidate
        env:
          PYTHON: /usr/bin/python3
        run: |
          npm run reproduce -- qa-output/reproduction
          node --test analysis/test_narrated_http.cjs
      - name: Retain narrated videos, source receipts and batch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narrated-answer-batch
          path: qa-output/reproduction/
          retention-days: 14
          if-no-files-found: warn
