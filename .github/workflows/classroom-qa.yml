name: Classroom end-to-end QA

on:
  push:
    branches:
      - main
      - final-delivery-review-handoff-20261120
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline demo tests (no dependencies)
        run: npm test
      - name: Run offline extension evidence and ZIP regressions
        run: node --test classroom/offline-review-mv3/bind-source-paragraph.test.cjs classroom/offline-review-mv3/approved-revision-archive.test.mjs classroom/offline-review-mv3/reviewed-archive-cli.test.mjs classroom/offline-review-mv3/verified-zip.test.mjs
